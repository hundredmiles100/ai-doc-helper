<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocHelper — Your private documents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  </head>
  <body>
    <!-- liquid glass svg filter — true refraction -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <filter id="liquidGlass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.009 0.009" numOctaves="2" seed="2" result="turb" />
          <feDisplacementMap in="SourceGraphic" in2="turb" scale="6" xChannelSelector="R" yChannelSelector="G" result="disp" />
          <feGaussianBlur in="disp" stdDeviation="0.4" result="blur" />
          <feComponentTransfer><feFuncA type="discrete" tableValues="1 1"/></feComponentTransfer>
        </filter>
        <filter id="liquidGlassHover" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="5" result="turb2" />
          <feDisplacementMap in="SourceGraphic" in2="turb2" scale="10" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
